name: iOS unsigned IPA (Vector)

# Builds an UNSIGNED .ipa on a GitHub macOS runner. Install it on an iPhone by signing it
# with your own Apple ID using Sideloadly or AltStore (free Apple ID: valid for 7 days).
# Runs when this branch is pushed (docs/assets-only pushes are ignored) or manually.
on:
  push:
    branches: [meetcs-base-vector-android]
    paths-ignore:
      - 'store-assets/**'
      - '**.md'
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.16.0

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Apply client config
        run: node scripts/apply-config.js

      - name: Build web app and prepare iOS project
        env:
          NODE_ENV: production
          npm_config_include: dev
          NODE_OPTIONS: --max-old-space-size=8192
        run: |
          mkdir -p www
          npx cordova platform add ios
          npx ionic cordova prepare ios --prod

      - name: Build app without code signing
        run: |
          # Xcode 26 rejects the private header <netinet6/in6.h> used by the advanced-http plugin.
          # The same definitions are in the public <netinet/in.h>.
          grep -rl "netinet6/in6.h" platforms/ios/App/Plugins | xargs perl -pi -e 's#<netinet6/in6.h>#<netinet/in.h>#g'
          # The push plugin hard-codes "Moodle-Swift.h"; the header is named after the app.
          MODULE=$(sed -n 's:.*<name>\(.*\)</name>.*:\1:p' config.xml | head -1 | sed 's/[^A-Za-z0-9_]/_/g')
          echo "Swift module name: $MODULE"
          grep -rl "Moodle-Swift.h" platforms/ios/App/Plugins | MODULE="$MODULE" xargs perl -pi -e 's|#import "Moodle-Swift\.h"|#if __has_include("App-Swift.h")\n#import "App-Swift.h"\n#else\n#import "$ENV{MODULE}-Swift.h"\n#endif|'
          WS=$(ls -d platforms/ios/*.xcworkspace | head -1)
          SCHEME=$(basename "$WS" .xcworkspace)
          echo "Workspace: $WS  Scheme: $SCHEME"
          xcodebuild \
            -workspace "$WS" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Package .ipa
        run: |
          APP=$(ls -d build/Build/Products/Release-iphoneos/*.app | head -1)
          echo "App: $APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry Vector-unsigned.ipa Payload
          ls -la Vector-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Vector-unsigned-ipa
          path: Vector-unsigned.ipa
          retention-days: 7
